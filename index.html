<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="은혜와진리교회" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>은혜와진리교회</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 100%;
        height: 100%;
        background-color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", sans-serif;
      }
      .splash-wrap {
        display: flex;
        min-height: 100dvh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #ffffff;
        padding: 24px;
      }
      .emblem {
        width: 112px;
        height: 112px;
        object-fit: contain;
        user-select: none;
        -webkit-user-drag: none;
        animation: fadeIn 0.35s ease-out;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: scale(0.96); }
        to { opacity: 1; transform: scale(1); }
      }
      .error-box {
        display: none;
        margin-top: 24px;
        text-align: center;
      }
      .error-text {
        font-size: 14px;
        color: #57534e;
        margin-bottom: 14px;
        line-height: 1.5;
      }
      .retry-btn {
        padding: 10px 22px;
        border-radius: 9999px;
        border: 1px solid #d6d3d1;
        background: #ffffff;
        color: #25274D;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="splash-wrap">
      <img src="./logo-emblem.png" alt="은혜와진리교회" class="emblem" draggable="false" />
      <div id="errorBox" class="error-box">
        <p class="error-text">교회 서버에 연결하지 못했습니다.<br />잠시 후 다시 시도해 주세요.</p>
        <button class="retry-btn" onclick="connectServer()">다시 시도</button>
      </div>
    </div>

    <script>
      const GIST_ID = "504fbba58649ceaaefddc468b28ea259";
      const GIST_API = "https://api.github.com/gists/" + GIST_ID;
      const GIST_RAW = "https://gist.githubusercontent.com/dailyplantLabs/" + GIST_ID + "/raw/public-url.txt";

      async function fetchLatestUrl() {
        try {
          const res = await fetch(GIST_API + "?t=" + Date.now(), { cache: "no-store" });
          if (res.ok) {
            const data = await res.json();
            if (data && data.files && data.files["public-url.txt"] && data.files["public-url.txt"].content) {
              const url = data.files["public-url.txt"].content.trim();
              if (url.startsWith("https://")) return url;
            }
          }
        } catch (e) {}

        try {
          const res2 = await fetch(GIST_RAW + "?t=" + Date.now(), { cache: "no-store" });
          if (res2.ok) {
            const text = (await res2.text()).trim();
            if (text.startsWith("https://")) return text;
          }
        } catch (e) {}

        try {
          const res3 = await fetch("./public-url.txt?t=" + Date.now(), { cache: "no-store" });
          if (res3.ok) {
            const text = (await res3.text()).trim();
            if (text.startsWith("https://")) return text;
          }
        } catch (e) {}

        return null;
      }

      async function connectServer() {
        const errorBox = document.getElementById("errorBox");
        errorBox.style.display = "none";

        const minSplashDelay = new Promise((r) => setTimeout(r, 650));
        const [baseUrl] = await Promise.all([fetchLatestUrl(), minSplashDelay]);

        if (!baseUrl) {
          errorBox.style.display = "block";
          return;
        }

        const cleanBase = baseUrl.replace(/\/+$/, "");
        const subPath = window.location.search + window.location.hash;
        const targetUrl = cleanBase + "/" + (subPath.startsWith("?") || subPath.startsWith("#") ? subPath : "");

        window.location.replace(targetUrl);
      }

      connectServer();
    </script>
  </body>
</html>
