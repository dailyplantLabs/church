<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="은혜와진리교회" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>은혜와진리교회</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #ffffff;
        color: #1c1917;
        font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Malgun Gothic", "맑은 고딕", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      /* 1단계: 스플래시 화면 (하얀 배경 + 정중앙 원형 엠블럼) */
      #splashScreen {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #ffffff;
      }
      .splash-emblem {
        width: 112px;
        height: 112px;
        object-fit: contain;
        user-select: none;
        -webkit-user-drag: none;
      }

      /* 2단계: 로그인 화면 (첫 로그인 또는 로그아웃 시에만 표시) */
      #loginScreen {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: none;
        margin: 0 auto;
        min-height: 100dvh;
        max-width: 32rem;
        flex-direction: column;
        background-color: #ffffff;
        padding: 0 20px;
        overflow-y: auto;
        animation: loginFadeIn 0.25s ease-out;
      }
      @media (min-width: 640px) {
        #loginScreen {
          padding: 0 32px;
        }
      }
      @keyframes loginFadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .login-inner {
        display: flex;
        flex: 1;
        flex-direction: column;
        justify-content: center;
        padding: 40px 0;
      }
      .login-emblem {
        width: 80px;
        height: 80px;
        object-fit: contain;
        margin-bottom: 20px;
        user-select: none;
        -webkit-user-drag: none;
      }
      @media (min-width: 640px) {
        .login-emblem {
          width: 96px;
          height: 96px;
        }
      }
      .login-wordmark {
        height: 32px;
        width: auto;
        max-width: 100%;
        align-self: flex-start;
        object-fit: contain;
        user-select: none;
        -webkit-user-drag: none;
      }
      @media (min-width: 640px) {
        .login-wordmark {
          height: 36px;
        }
      }
      .login-desc {
        margin-top: 12px;
        font-size: 15px;
        line-height: 1.625;
        color: #57534e;
      }
      .login-actions {
        margin-top: 40px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .google-btn {
        display: flex;
        width: 100%;
        align-items: center;
        justify-content: center;
        gap: 12px;
        border-radius: 9999px;
        border: 1px solid #d6d3d1;
        background-color: #ffffff;
        padding: 12px 20px;
        font-size: 15px;
        font-weight: 600;
        color: #292524;
        box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.04);
        cursor: pointer;
        transition: background-color 0.15s ease, transform 0.1s ease;
      }
      .google-btn:hover {
        background-color: #fafaf9;
      }
      .google-btn:active {
        transform: scale(0.99);
      }
      .google-btn:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .google-icon {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
      }
      .error-msg {
        display: none;
        border-radius: 12px;
        background-color: #fef2f2;
        padding: 12px 16px;
        font-size: 14px;
        line-height: 1.5;
        color: #b91c1c;
      }

      /* 3단계: 고정 도메인(dailyplantlabs.github.io/church/) 내부에 전체화면으로 렌더링되는 커뮤니티 앱 컨테이너
         -> 도메인이 바뀌지 않으므로 PWA 상단에 trycloudflare.com 주소창 바가 절대 나타나지 않으며 로그인도 영구 유지됩니다. */
      #appFrame {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: none;
        width: 100%;
        height: 100%;
        border: 0;
        background-color: #ffffff;
      }
    </style>
  </head>
  <body>
    <!-- 1. 첫 접속 시 보여주는 은혜와진리교회 원형 마크 스플래시 화면 -->
    <div id="splashScreen">
      <img src="./logo-emblem.png" alt="은혜와진리교회" class="splash-emblem" draggable="false" />
    </div>

    <!-- 2. 로그인 화면 (이미 로그인된 성도는 자동으로 건너뛰고 바로 홈 화면으로 진입) -->
    <main id="loginScreen">
      <div class="login-inner">
        <img src="./logo-emblem.png" alt="은혜와진리교회 엠블럼" class="login-emblem" draggable="false" />
        <img src="./logo-bottom.png" alt="은혜와진리교회" class="login-wordmark" draggable="false" />
        <p class="login-desc">
          우리 교회 성도들만 들어올 수 있는 공간이에요.<br />
          가입 후 관리자 승인이 필요합니다.
        </p>

        <div class="login-actions">
          <button type="button" id="googleLoginBtn" class="google-btn">
            <svg class="google-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="#4285F4"
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
              />
              <path
                fill="#34A853"
                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              />
              <path
                fill="#FBBC05"
                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
              />
              <path
                fill="#EA4335"
                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
              />
            </svg>
            <span id="googleBtnText">Google 계정으로 계속하기</span>
          </button>

          <p id="errorBox" class="error-msg"></p>
        </div>
      </div>
    </main>

    <!-- 3. 고정 도메인 내부 전체화면 커뮤니티 프레임 -->
    <iframe
      id="appFrame"
      title="은혜와진리교회 커뮤니티"
      allow="camera; microphone; fullscreen; clipboard-read; clipboard-write; web-share; autoplay"
    ></iframe>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
      import {
        getAuth,
        GoogleAuthProvider,
        signInWithPopup,
        onAuthStateChanged,
        signOut,
        setPersistence,
        browserLocalPersistence
      } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

      const FIREBASE_CONFIG = {
        apiKey: "AIzaSyBt9MFhWdbZIJxW2O71B8E-nZVylH8kZq8",
        authDomain: "church-6717c.firebaseapp.com",
        projectId: "church-6717c",
        appId: "1:844059876228:web:8975acd6fc0c18de07dbd1"
      };

      const app = initializeApp(FIREBASE_CONFIG);
      const auth = getAuth(app);
      auth.languageCode = "ko";
      setPersistence(auth, browserLocalPersistence).catch(() => {});

      const GIST_ID = "504fbba58649ceaaefddc468b28ea259";
      const GIST_API = "https://api.github.com/gists/" + GIST_ID;
      const GIST_RAW = "https://gist.githubusercontent.com/dailyplantLabs/" + GIST_ID + "/raw/public-url.txt";
      const LOGGED_OUT_KEY = "cc_gateway_logged_out";
      const CACHED_TUNNEL_KEY = "cc_cached_tunnel_url";

      let liveTunnelUrl = "";
      let frameFallbackTimer = null;

      async function fetchLatestUrl() {
        const params = new URLSearchParams(window.location.search);
        const returnTo = params.get("returnTo");
        if (returnTo && returnTo.startsWith("https://")) {
          const clean = returnTo.replace(/\/+$/, "");
          try { localStorage.setItem(CACHED_TUNNEL_KEY, clean); } catch (e) {}
          return clean;
        }

        try {
          const res = await fetch(GIST_API + "?t=" + Date.now(), { cache: "no-store" });
          if (res.ok) {
            const data = await res.json();
            if (data && data.files && data.files["public-url.txt"] && data.files["public-url.txt"].content) {
              const url = data.files["public-url.txt"].content.trim();
              if (url.startsWith("https://")) {
                const clean = url.replace(/\/+$/, "");
                try { localStorage.setItem(CACHED_TUNNEL_KEY, clean); } catch (e) {}
                return clean;
              }
            }
          }
        } catch (e) {}

        try {
          const res2 = await fetch(GIST_RAW + "?t=" + Date.now(), { cache: "no-store" });
          if (res2.ok) {
            const text = (await res2.text()).trim();
            if (text.startsWith("https://")) {
              const clean = text.replace(/\/+$/, "");
              try { localStorage.setItem(CACHED_TUNNEL_KEY, clean); } catch (e) {}
              return clean;
            }
          }
        } catch (e) {}

        try {
          const res3 = await fetch("./public-url.txt?t=" + Date.now(), { cache: "no-store" });
          if (res3.ok) {
            const text = (await res3.text()).trim();
            if (text.startsWith("https://")) {
              const clean = text.replace(/\/+$/, "");
              try { localStorage.setItem(CACHED_TUNNEL_KEY, clean); } catch (e) {}
              return clean;
            }
          }
        } catch (e) {}

        try {
          const cached = localStorage.getItem(CACHED_TUNNEL_KEY);
          if (cached && cached.startsWith("https://")) return cached;
        } catch (e) {}

        return "";
      }

      function waitForInitialAuthUser() {
        return new Promise((resolve) => {
          const unsub = onAuthStateChanged(
            auth,
            (user) => {
              unsub();
              resolve(user);
            },
            () => {
              unsub();
              resolve(null);
            }
          );
        });
      }

      const splashEl = document.getElementById("splashScreen");
      const loginEl = document.getElementById("loginScreen");
      const appFrameEl = document.getElementById("appFrame");
      const btnEl = document.getElementById("googleLoginBtn");
      const btnTextEl = document.getElementById("googleBtnText");
      const errorEl = document.getElementById("errorBox");

      function showError(msg) {
        errorEl.textContent = msg;
        errorEl.style.display = "block";
      }

      function showLoginScreen() {
        if (frameFallbackTimer) {
          clearTimeout(frameFallbackTimer);
          frameFallbackTimer = null;
        }
        appFrameEl.style.display = "none";
        splashEl.style.display = "none";
        loginEl.style.display = "flex";
        btnEl.disabled = false;
        btnTextEl.textContent = "Google 계정으로 계속하기";
      }

      function revealAppFrame() {
        if (frameFallbackTimer) {
          clearTimeout(frameFallbackTimer);
          frameFallbackTimer = null;
        }
        loginEl.style.display = "none";
        appFrameEl.style.display = "block";
        splashEl.style.display = "none";
      }

      function openCommunityWithToken(targetBase, idToken) {
        loginEl.style.display = "none";
        splashEl.style.display = "flex";
        appFrameEl.style.display = "block";
        appFrameEl.src = targetBase + "/#firebase_token=" + encodeURIComponent(idToken);

        if (frameFallbackTimer) clearTimeout(frameFallbackTimer);
        frameFallbackTimer = setTimeout(() => {
          revealAppFrame();
        }, 2200);
      }

      appFrameEl.addEventListener("load", () => {
        // 프레임 로드 직후 React 마운트 완료 메시지(CC_APP_READY)가 오거나 짧은 딜레이 후 스플래시 해제
        setTimeout(() => {
          if (appFrameEl.src && appFrameEl.src !== "about:blank") {
            revealAppFrame();
          }
        }, 350);
      });

      // 내부 커뮤니티 앱(appFrame)으로부터의 이벤트 수신 (준비 완료 / 로그아웃 / 재인증 요청)
      window.addEventListener("message", async (event) => {
        const data = event.data;
        if (!data || typeof data.type !== "string") return;

        if (data.type === "CC_APP_READY") {
          revealAppFrame();
        } else if (data.type === "CC_LOGOUT") {
          try { localStorage.setItem(LOGGED_OUT_KEY, "1"); } catch (e) {}
          try { await signOut(auth); } catch (e) {}
          appFrameEl.src = "about:blank";
          showLoginScreen();
        } else if (data.type === "CC_NEED_LOGIN") {
          const explicitlyLoggedOut = (() => {
            try { return localStorage.getItem(LOGGED_OUT_KEY) === "1"; } catch (e) { return false; }
          })();
          if (!data.forcePrompt && !explicitlyLoggedOut && auth.currentUser) {
            try {
              const freshToken = await auth.currentUser.getIdToken(true);
              if (appFrameEl.contentWindow) {
                appFrameEl.contentWindow.postMessage({ type: "CC_FIREBASE_TOKEN", idToken: freshToken }, "*");
                return;
              }
            } catch (e) {}
          }
          showLoginScreen();
        }
      });

      async function initFlow() {
        const params = new URLSearchParams(window.location.search);
        const forceLogin = params.get("login") === "1";
        if (forceLogin) {
          window.history.replaceState(null, "", window.location.pathname);
        }

        const minSplash = new Promise((r) => setTimeout(r, 550));
        const [url, existingUser] = await Promise.all([
          fetchLatestUrl(),
          waitForInitialAuthUser(),
          minSplash
        ]);
        liveTunnelUrl = url;

        const explicitlyLoggedOut = (() => {
          try { return localStorage.getItem(LOGGED_OUT_KEY) === "1"; } catch (e) { return false; }
        })();

        // 이미 로그인된 성도는 매번 다시 로그인할 필요 없이 자동으로 토큰을 갱신하여 바로 홈 화면으로 진입
        if (existingUser && !forceLogin && !explicitlyLoggedOut && liveTunnelUrl) {
          try {
            const idToken = await existingUser.getIdToken();
            openCommunityWithToken(liveTunnelUrl, idToken);
            return;
          } catch (e) {
            // 토큰 갱신 실패 시 로그인 화면 표시
          }
        }

        showLoginScreen();
      }

      btnEl.addEventListener("click", async () => {
        btnEl.disabled = true;
        btnTextEl.textContent = "구글 로그인 연결 중...";
        errorEl.style.display = "none";

        try {
          const provider = new GoogleAuthProvider();
          provider.setCustomParameters({ prompt: "select_account" });

          const result = await signInWithPopup(auth, provider);
          const idToken = await result.user.getIdToken();
          try { localStorage.removeItem(LOGGED_OUT_KEY); } catch (e) {}

          const targetBase = (await fetchLatestUrl()) || liveTunnelUrl;
          if (!targetBase) {
            throw new Error("현재 교회 서버가 켜져 있지 않거나 연결 주소를 찾을 수 없습니다.");
          }
          liveTunnelUrl = targetBase;

          openCommunityWithToken(targetBase, idToken);
        } catch (err) {
          const code = err && err.code ? err.code : "";
          if (code === "auth/popup-closed-by-user" || code === "auth/cancelled-popup-request") {
            showError("구글 로그인 창이 닫혔습니다. 다시 시도해 주세요.");
          } else if (code === "auth/popup-blocked") {
            showError("브라우저에서 팝업이 차단되었습니다. 팝업 차단을 해제한 뒤 다시 시도해 주세요.");
          } else if (code === "auth/unauthorized-domain") {
            showError("Firebase 콘솔 → Authentication → 설정 → 승인된 도메인에 dailyplantlabs.github.io 를 추가해 주세요.");
          } else {
            showError((err && err.message) || "구글 로그인 중 오류가 발생했습니다.");
          }
          btnEl.disabled = false;
          btnTextEl.textContent = "Google 계정으로 계속하기";
        }
      });

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(() => {});
        });
      }

      initFlow();
    </script>
  </body>
</html>
